<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Matches the "FH" logomark used in the app sidebar and login card:
       rounded-square with the brand green→emerald gradient, white "FH" mark
       centred, subtle inner highlight for a premium look. -->
  <defs>
    <linearGradient id="fefsa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1a9162"/>
      <stop offset="100%" stop-color="#0b7a4a"/>
    </linearGradient>
    <linearGradient id="fefsa-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#fefsa-bg)"/>
  <!-- Top highlight -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#fefsa-hi)"/>

  <!-- "FH" wordmark -->
  <text
    x="32" y="42"
    text-anchor="middle"
    font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-weight="900"
    font-size="30"
    letter-spacing="1"
    fill="#ffffff"
  >FH</text>
</svg>
